<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <div th:fragment="content">
        <!-- 页面内容开始 -->
        
        <!-- 统计卡片 -->
        <div class="row">
            <div class="col-xl-3 col-md-6">
                <div class="stat-card blue">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-icon">
                                <i class="bi bi-receipt"></i>
                            </div>
                            <div class="stat-value" id="stat-total-orders">0</div>
                            <div class="stat-label">今日订单数</div>
                            <div class="stat-change up">
                                <i class="bi bi-arrow-up"></i> 12.5% 较昨日
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-xl-3 col-md-6">
                <div class="stat-card green">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-icon">
                                <i class="bi bi-person-badge"></i>
                            </div>
                            <div class="stat-value" id="stat-online-drivers">0</div>
                            <div class="stat-label">在线司机数</div>
                            <div class="stat-change up">
                                <i class="bi bi-arrow-up"></i> 8.2% 较昨日
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-xl-3 col-md-6">
                <div class="stat-card orange">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-icon">
                                <i class="bi bi-cash-stack"></i>
                            </div>
                            <div class="stat-value" id="stat-revenue">¥0.00</div>
                            <div class="stat-label">今日营收</div>
                            <div class="stat-change up">
                                <i class="bi bi-arrow-up"></i> 15.3% 较昨日
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-xl-3 col-md-6">
                <div class="stat-card yellow">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-icon">
                                <i class="bi bi-percent"></i>
                            </div>
                            <div class="stat-value" id="stat-completion-rate">0%</div>
                            <div class="stat-label">成交率</div>
                            <div class="stat-change down">
                                <i class="bi bi-arrow-down"></i> 1.1% 较昨日
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 行2：订单状态和司机状态 -->
        <div class="row">
            <!-- 订单状态分布 -->
            <div class="col-xl-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-graph-down me-2"></i>订单状态分布</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="refreshOrderStats()">
                            <i class="bi bi-arrow-repeat"></i> 刷新
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="orderStatusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 司机状态分布 -->
            <div class="col-xl-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-people me-2"></i>司机状态分布</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="refreshDriverStats()">
                            <i class="bi bi-arrow-repeat"></i> 刷新
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="driverStatusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 实时数据面板 -->
            <div class="col-xl-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-lightning-charge me-2"></i>实时数据</h5>
                        <span class="badge bg-success" id="realtime-badge">
                            <i class="bi bi-circle-fill"></i> 实时更新
                        </span>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush" id="realtime-list">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-clock-history me-2 text-warning"></i>待接订单</span>
                                <span class="badge bg-warning rounded-pill" id="rt-pending">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-box-arrow-in-right me-2 text-info"></i>已接订单</span>
                                <span class="badge bg-info rounded-pill" id="rt-accepted">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-car-front me-2 text-primary"></i>服务中</span>
                                <span class="badge bg-primary rounded-pill" id="rt-inservice">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-person-fill-check me-2 text-success"></i>空闲司机</span>
                                <span class="badge bg-success rounded-pill" id="rt-free">0</span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-exclamation-triangle me-2 text-danger"></i>待处理投诉</span>
                                <span class="badge bg-danger rounded-pill" id="rt-complaints">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 行3：订单趋势和收入趋势 -->
        <div class="row">
            <!-- 订单趋势图 -->
            <div class="col-xl-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-graph-up me-2"></i>订单趋势（近7天）</h5>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary active">7天</button>
                            <button class="btn btn-outline-primary">30天</button>
                            <button class="btn btn-outline-primary">90天</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="orderTrendChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 收入趋势图 -->
            <div class="col-xl-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-graph-up-arrow me-2"></i>收入趋势（近7天）</h5>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary active">7天</button>
                            <button class="btn btn-outline-primary">30天</button>
                            <button class="btn btn-outline-primary">90天</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="revenueTrendChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 行4：最近订单和司机排行榜 -->
        <div class="row">
            <!-- 最近订单 -->
            <div class="col-xl-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-clock-history me-2"></i>最近订单</h5>
                        <a href="/order" class="btn btn-sm btn-outline-primary">
                            查看全部 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>订单号</th>
                                        <th>出发地</th>
                                        <th>目的地</th>
                                        <th>状态</th>
                                        <th>金额</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-orders-tbody">
                                    <!-- 动态加载数据 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 司机排行榜 -->
            <div class="col-xl-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="bi bi-trophy me-2"></i>司机排行榜</h5>
                        <a href="/driver" class="btn btn-sm btn-outline-primary">
                            查看全部 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>司机</th>
                                        <th>评分</th>
                                        <th>订单数</th>
                                        <th>今日收入</th>
                                    </tr>
                                </thead>
                                <tbody id="top-drivers-tbody">
                                    <!-- 动态加载数据 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 页面内容结束 -->
    </div>
    
    <script th:inline="javascript">
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            setActiveMenu('menu-dashboard');
            setPageTitle('数据概览');
            
            // 初始化图表
            initCharts();
            
            // 加载数据
            loadDashboardData();
            
            // 启动实时数据刷新
            startRealTimeRefresh();
        });
        
        // 图表实例
        let orderStatusChart, driverStatusChart, orderTrendChart, revenueTrendChart;
        
        // 初始化图表
        function initCharts() {
            // 订单状态饼图
            const orderCtx = document.getElementById('orderStatusChart').getContext('2d');
            orderStatusChart = new Chart(orderCtx, {
                type: 'doughnut',
                data: {
                    labels: ['待接单', '已接单', '服务中', '已完成', '已取消'],
                    datasets: [{
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: [
                            '#ffc107',
                            '#17a2b8',
                            '#007bff',
                            '#28a745',
                            '#dc3545'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            // 司机状态饼图
            const driverCtx = document.getElementById('driverStatusChart').getContext('2d');
            driverStatusChart = new Chart(driverCtx, {
                type: 'pie',
                data: {
                    labels: ['在线', '服务中', '离线', '暂停'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: [
                            '#28a745',
                            '#007bff',
                            '#6c757d',
                            '#ffc107'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            // 订单趋势折线图
            const orderTrendCtx = document.getElementById('orderTrendChart').getContext('2d');
            orderTrendChart = new Chart(orderTrendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '总订单',
                            data: [],
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0, 123, 255, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '完成订单',
                            data: [],
                            borderColor: '#28a745',
                            backgroundColor: 'rgba(40, 167, 69, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
            
            // 收入趋势柱状图
            const revenueTrendCtx = document.getElementById('revenueTrendChart').getContext('2d');
            revenueTrendChart = new Chart(revenueTrendCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '营收（元）',
                        data: [],
                        backgroundColor: 'rgba(13, 110, 253, 0.8)',
                        borderColor: '#0d6efd',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        // 加载Dashboard数据
        function loadDashboardData() {
            // 加载订单统计
            ajaxRequest('/api/order/stats').then(data => {
                updateOrderStats(data);
            });
            
            // 加载司机统计
            ajaxRequest('/api/driver/stats').then(data => {
                updateDriverStats(data);
            });
            
            // 加载报表统计
            ajaxRequest('/api/report/dashboard').then(data => {
                updateReportStats(data);
            });
            
            // 加载订单趋势
            ajaxRequest('/api/report/trend/order').then(data => {
                updateOrderTrend(data);
            });
            
            // 加载收入趋势
            ajaxRequest('/api/report/trend/revenue').then(data => {
                updateRevenueTrend(data);
            });
            
            // 加载最近订单
            ajaxRequest('/api/order/list').then(data => {
                updateRecentOrders(data);
            });
            
            // 加载司机排行榜
            ajaxRequest('/api/driver/top?limit=5').then(data => {
                updateTopDrivers(data);
            });
            
            // 加载投诉统计
            ajaxRequest('/api/report/complaint/stats').then(data => {
                updateComplaintStats(data);
            });
        }
        
        // 更新订单统计
        function updateOrderStats(data) {
            document.getElementById('stat-total-orders').textContent = data.todayOrders || data.total || 0;
            
            // 更新饼图数据
            orderStatusChart.data.datasets[0].data = [
                data.pendingWaiting || 0,
                data.accepted || 0,
                data.inService || 0,
                data.completed || 0,
                data.cancelled || 0
            ];
            orderStatusChart.update();
            
            // 更新实时数据
            document.getElementById('rt-pending').textContent = data.pendingWaiting || 0;
            document.getElementById('rt-accepted').textContent = data.accepted || 0;
            document.getElementById('rt-inservice').textContent = data.inService || 0;
        }
        
        // 更新司机统计
        function updateDriverStats(data) {
            document.getElementById('stat-online-drivers').textContent = data.onlineTotal || 0;
            
            // 更新饼图数据
            driverStatusChart.data.datasets[0].data = [
                data.online || 0,
                data.inService || 0,
                data.offline || 0,
                data.paused || 0
            ];
            driverStatusChart.update();
            
            // 更新实时数据
            document.getElementById('rt-free').textContent = data.online || 0;
        }
        
        // 更新报表统计
        function updateReportStats(data) {
            const stats = data.stats || {};
            document.getElementById('stat-revenue').textContent = formatCurrency(stats.todayRevenue);
            
            // 成交率
            const completionRate = stats.todayCompletionRate || 0;
            document.getElementById('stat-completion-rate').textContent = parseFloat(completionRate).toFixed(1) + '%';
        }
        
        // 更新投诉统计
        function updateComplaintStats(data) {
            document.getElementById('rt-complaints').textContent = data.pending || 0;
        }
        
        // 更新订单趋势
        function updateOrderTrend(data) {
            if (!data || data.length === 0) return;
            
            const labels = data.map(item => {
                const date = new Date(item.date);
                return (date.getMonth() + 1) + '/' + date.getDate();
            });
            
            orderTrendChart.data.labels = labels;
            orderTrendChart.data.datasets[0].data = data.map(item => item.totalOrders || 0);
            orderTrendChart.data.datasets[1].data = data.map(item => item.completedOrders || 0);
            orderTrendChart.update();
        }
        
        // 更新收入趋势
        function updateRevenueTrend(data) {
            if (!data || data.length === 0) return;
            
            const labels = data.map(item => {
                const date = new Date(item.date);
                return (date.getMonth() + 1) + '/' + date.getDate();
            });
            
            revenueTrendChart.data.labels = labels;
            revenueTrendChart.data.datasets[0].data = data.map(item => item.totalRevenue || 0);
            revenueTrendChart.update();
        }
        
        // 更新最近订单
        function updateRecentOrders(data) {
            const tbody = document.getElementById('recent-orders-tbody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>';
                return;
            }
            
            // 显示最近5条
            const recentData = data.slice(0, 5);
            let html = '';
            recentData.forEach(order => {
                const statusClass = getOrderStatusClass(order.status);
                const statusText = getOrderStatusText(order.status);
                html += `
                    <tr>
                        <td><code>${order.orderNo}</code></td>
                        <td>${order.startLocation || '-'}</td>
                        <td>${order.endLocation || '-'}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${formatCurrency(order.actualAmount || order.estimatedAmount)}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }
        
        // 更新司机排行榜
        function updateTopDrivers(data) {
            const tbody = document.getElementById('top-drivers-tbody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>';
                return;
            }
            
            let html = '';
            data.forEach((driver, index) => {
                const rankIcon = index === 0 ? '<i class="bi bi-trophy-fill text-warning"></i>' :
                                 index === 1 ? '<i class="bi bi-trophy-fill text-secondary"></i>' :
                                 index === 2 ? '<i class="bi bi-trophy-fill text-danger"></i>' :
                                 (index + 1);
                html += `
                    <tr>
                        <td>${rankIcon}</td>
                        <td>${driver.name || '-'}</td>
                        <td><span class="text-warning"><i class="bi bi-star-fill"></i> ${driver.rating || 0}</span></td>
                        <td>${driver.totalOrders || 0}</td>
                        <td>${formatCurrency(driver.todayIncome)}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }
        
        // 获取订单状态样式
        function getOrderStatusClass(status) {
            switch (status) {
                case 'PENDING_WAITING': return 'status-pending';
                case 'ACCEPTED': return 'status-pending';
                case 'IN_SERVICE': return 'status-inservice';
                case 'COMPLETED': return 'status-active';
                case 'CANCELLED': return 'status-cancelled';
                default: return 'status-pending';
            }
        }
        
        // 获取订单状态文本
        function getOrderStatusText(status) {
            switch (status) {
                case 'PENDING_WAITING': return '待接单';
                case 'ACCEPTED': return '已接单';
                case 'PICKING_UP': return '接驾中';
                case 'IN_SERVICE': return '服务中';
                case 'COMPLETED': return '已完成';
                case 'CANCELLED': return '已取消';
                default: return status;
            }
        }
        
        // 刷新订单统计
        function refreshOrderStats() {
            ajaxRequest('/api/order/stats').then(data => {
                updateOrderStats(data);
                showToast('订单统计已刷新', 'success');
            });
        }
        
        // 刷新司机统计
        function refreshDriverStats() {
            ajaxRequest('/api/driver/stats').then(data => {
                updateDriverStats(data);
                showToast('司机统计已刷新', 'success');
            });
        }
        
        // 启动实时数据刷新
        function startRealTimeRefresh() {
            // 每30秒刷新一次实时数据
            setInterval(() => {
                ajaxRequest('/api/monitor/realtime').then(data => {
                    updateRealtimeData(data);
                }).catch(() => {});
            }, 30000);
        }
        
        // 更新实时数据
        function updateRealtimeData(data) {
            if (data.pendingOrders !== undefined) {
                document.getElementById('rt-pending').textContent = data.pendingOrders;
            }
            if (data.activeOrders !== undefined) {
                document.getElementById('rt-accepted').textContent = data.activeOrders;
            }
            if (data.inServiceOrders !== undefined) {
                document.getElementById('rt-inservice').textContent = data.inServiceOrders;
            }
            if (data.onlineDrivers !== undefined) {
                document.getElementById('rt-free').textContent = data.onlineDrivers;
            }
        }
    </script>
</body>
</html>
