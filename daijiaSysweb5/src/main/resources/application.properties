# 服务器配置
server.port=8080
server.servlet.context-path=/

# 数据源配置 - H2内存数据库
spring.datasource.url=jdbc:h2:mem:daijiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA配置
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# 数据库初始化
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# 高德地图API配置
gaode.map.key=your_amap_key_here
gaode.map.url=https://restapi.amap.com/v3

# 应用配置
daijia.admin.username=admin
daijia.admin.password=123456
