server:
  port: 8080

spring:
  application:
    name: daijia-sys-api
  
  datasource:
    url: jdbc:h2:file:./data/daijia_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.daijia: debug
    org.hibernate.SQL: debug
