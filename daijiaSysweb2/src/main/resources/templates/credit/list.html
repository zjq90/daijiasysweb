<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('信用等级管理 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-star text-warning"></i> 信用等级管理</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/credit/add" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> 新增等级
                    </a>
                </div>
            </div>

            <div class="row g-4">
                <div th:each="level : ${creditLevels}" class="col-lg-4 col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-white">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0" th:text="${level.levelName}">钻石级</h5>
                                    <span class="badge rounded-pill bg-primary" th:text="${level.levelCode}">A</span>
                                </div>
                                <div>
                                    <i class="bi bi-star-fill text-warning" style="font-size: 1.5rem;"></i>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <table class="table table-borderless table-sm">
                                <tr>
                                    <td class="text-muted">分数范围</td>
                                    <td th:text="${level.minScore} + ' - ' + ${level.maxScore}">90 - 100</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">分成比例</td>
                                    <td>
                                        <span class="text-success fw-bold" th:text="${level.commissionRate} + '%'">90%</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-muted" style="vertical-align: top;">等级描述</td>
                                    <td th:text="${level.description}">最高等级，分成比例最高</td>
                                </tr>
                            </table>
                        </div>
                        <div class="card-footer bg-white">
                            <div class="btn-group btn-group-sm w-100">
                                <a th:href="@{/credit/detail/{id}(id=${level.id})}" class="btn btn-outline-primary">
                                    <i class="bi bi-eye"></i> 详情
                                </a>
                                <a th:href="@{/credit/edit/{id}(id=${level.id})}" class="btn btn-outline-secondary">
                                    <i class="bi bi-pencil"></i> 编辑
                                </a>
                                <a th:href="@{/credit/delete/{id}(id=${level.id})}" 
                                   class="btn btn-outline-danger" 
                                   onclick="return confirm('确定要删除该信用等级吗？')">
                                    <i class="bi bi-trash"></i> 删除
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(creditLevels)}" class="col-12">
                    <div class="card">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                            <p class="mt-2 text-muted">暂无信用等级数据</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
