<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('信用等级表单 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-star text-warning"></i> 
                    <span th:if="${creditLevel.id == null}">新增信用等级</span>
                    <span th:if="${creditLevel.id != null}">编辑信用等级</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/credit/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/credit/save}" th:object="${creditLevel}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">等级名称 <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{levelName}" class="form-control" placeholder="例如：钻石级、黄金级" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">等级代码 <span class="text-danger">*</span></label>
                                <select th:field="*{levelCode}" class="form-select" required>
                                    <option value="">请选择</option>
                                    <option value="A">A - 钻石级</option>
                                    <option value="B">B - 黄金级</option>
                                    <option value="C">C - 白银级</option>
                                    <option value="D">D - 青铜级</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">最低分数 <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{minScore}" class="form-control" placeholder="0-100" min="0" max="100" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">最高分数 <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{maxScore}" class="form-control" placeholder="0-100" min="0" max="100" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">分成比例 (%) <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{commissionRate}" class="form-control" placeholder="70-95" min="0" max="100" step="0.01" required>
                                <div class="form-text">司机获得的分成比例，平台抽成 = 100% - 此比例</div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">等级描述</label>
                                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="请输入等级描述"></textarea>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存
                                </button>
                                <a href="/credit/list" class="btn btn-secondary ms-2">
                                    <i class="bi bi-x-lg"></i> 取消
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
