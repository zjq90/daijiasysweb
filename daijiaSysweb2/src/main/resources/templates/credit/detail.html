<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('信用等级详情 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-star text-warning"></i> 信用等级详情</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/credit/edit/{id}(id=${creditLevel.id})}" class="btn btn-outline-primary">
                        <i class="bi bi-pencil"></i> 编辑
                    </a>
                    <a href="/credit/list" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="card text-center mb-4">
                        <div class="card-body py-5">
                            <div class="mb-3">
                                <i class="bi bi-star-fill text-warning" style="font-size: 4rem;"></i>
                            </div>
                            <h3 class="mb-1" th:text="${creditLevel.levelName}">钻石级</h3>
                            <span class="badge rounded-pill bg-primary" th:text="'等级 ' + ${creditLevel.levelCode}">等级 A</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 基本信息</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="text-muted">等级名称</label>
                                    <p class="fw-bold" th:text="${creditLevel.levelName}">钻石级</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">等级代码</label>
                                    <p class="fw-bold" th:text="${creditLevel.levelCode}">A</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">最低分数</label>
                                    <p th:text="${creditLevel.minScore}">90</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">最高分数</label>
                                    <p th:text="${creditLevel.maxScore}">100</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">司机分成比例</label>
                                    <p>
                                        <span class="text-success fw-bold" th:text="${creditLevel.commissionRate} + '%'">90%</span>
                                    </p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">平台抽成比例</label>
                                    <p>
                                        <span class="text-danger fw-bold" th:text="${100 - creditLevel.commissionRate} + '%'">10%</span>
                                    </p>
                                </div>
                                <div class="col-md-12">
                                    <label class="text-muted">等级描述</label>
                                    <p th:text="${creditLevel.description}">最高等级，分成比例最高</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
