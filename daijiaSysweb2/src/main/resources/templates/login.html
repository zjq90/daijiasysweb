<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 代驾后台管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 1rem 1rem 0 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="login-header text-center py-4">
                        <i class="bi bi-car-front-fill text-white" style="font-size: 3rem;"></i>
                        <h3 class="text-white mt-2 mb-0">代驾后台管理系统</h3>
                        <p class="text-white-50 mb-0 mt-1">Daijia Admin System</p>
                    </div>
                    <div class="card-body p-5">
                        <form th:action="@{/login}" method="post">
                            <div th:replace="fragments/layout::messages"></div>
                            
                            <div class="mb-4">
                                <label class="form-label">
                                    <i class="bi bi-person text-primary"></i> 用户名
                                </label>
                                <input type="text" name="username" class="form-control form-control-lg" placeholder="请输入用户名" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">
                                    <i class="bi bi-lock text-primary"></i> 密码
                                </label>
                                <input type="password" name="password" class="form-control form-control-lg" placeholder="请输入密码" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right"></i> 登录系统
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <p class="text-muted small mb-0">
                                <i class="bi bi-info-circle"></i> 
                                演示账号：admin / admin123
                            </p>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <p class="text-white-50 small">
                        <i class="bi bi-c-circle"></i> 2026 代驾后台管理系统 - 版权所有
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
