<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">代驾后台管理系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #343a40;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .sidebar .nav-link i {
            margin-right: 8px;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: calc(100vh - 56px);
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .stat-card {
            border-left: 4px solid #0d6efd;
        }
        .stat-card-success {
            border-left: 4px solid #198754;
        }
        .stat-card-warning {
            border-left: 4px solid #ffc107;
        }
        .stat-card-danger {
            border-left: 4px solid #dc3545;
        }
        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <i class="bi bi-car-front-fill"></i> 代驾后台管理系统
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/h2-console" target="_blank">
                        <i class="bi bi-database"></i> H2控制台
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">
                        <i class="bi bi-person-circle"></i> 管理员
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 侧边栏 -->
<nav th:fragment="sidebar" class="sidebar col-md-3 col-lg-2 d-md-block">
    <div class="pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/}" th:classappend="${#strings.equals(#request.requestURI, '/')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-house-door"></i> 系统首页
                </a>
            </li>
            <li class="nav-item mt-2">
                <span class="nav-link text-white-50">代驾账户管理</span>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/account/list}" th:classappend="${#strings.contains(#request.requestURI, '/account')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-people"></i> 账户信息
                </a>
            </li>
            <li class="nav-item mt-2">
                <span class="nav-link text-white-50">信用评价</span>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/complaint/list}" th:classappend="${#strings.contains(#request.requestURI, '/complaint')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-exclamation-circle"></i> 投诉单
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/credit/list}" th:classappend="${#strings.contains(#request.requestURI, '/credit')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-star"></i> 信用等级
                </a>
            </li>
            <li class="nav-item mt-2">
                <span class="nav-link text-white-50">订单分成配置</span>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/config/list}" th:classappend="${#strings.contains(#request.requestURI, '/config')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-gear"></i> 分成配置
                </a>
            </li>
            <li class="nav-item mt-2">
                <span class="nav-link text-white-50">账单管理</span>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/commission/list}" th:classappend="${#strings.contains(#request.requestURI, '/commission')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-file-earmark-bar-graph"></i> 分成单
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/recon/list}" th:classappend="${#strings.contains(#request.requestURI, '/recon')} ? 'nav-link active' : 'nav-link'">
                    <i class="bi bi-file-text"></i> 对账单
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- 消息提示 -->
<div th:fragment="messages" class="container mt-3">
    <div th:if="${message} or ${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${message != null ? message : success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle with Popper -->
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
