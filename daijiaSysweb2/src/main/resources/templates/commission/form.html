<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('分成单表单 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-file-earmark-text text-primary"></i> 
                    <span th:if="${commissionOrder.id == null}">新增分成单</span>
                    <span th:if="${commissionOrder.id != null}">编辑分成单</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/commission/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/commission/save}" th:object="${commissionOrder}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">分成单号</label>
                                <input type="text" th:field="*{commissionNo}" class="form-control" placeholder="系统自动生成" th:readonly="${commissionOrder.id != null}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">关联订单号 <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{orderNo}" class="form-control" placeholder="请输入订单号" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">司机ID <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{driverId}" class="form-control" placeholder="请输入司机ID" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">司机姓名</label>
                                <input type="text" th:field="*{driverName}" class="form-control" placeholder="请输入司机姓名">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">订单金额 (元) <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{orderAmount}" class="form-control" placeholder="例如：150.00" min="0" step="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">平台抽成 (元)</label>
                                <input type="number" th:field="*{platformCommission}" class="form-control" placeholder="自动计算" min="0" step="0.01">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">司机分成 (元)</label>
                                <input type="number" th:field="*{driverCommission}" class="form-control" placeholder="自动计算" min="0" step="0.01">
                            </div>
                            <div class="col-md-6" th:if="${commissionOrder.id != null}">
                                <label class="form-label">状态</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="PENDING">待结算</option>
                                    <option value="SETTLED">已结算</option>
                                    <option value="CANCELLED">已取消</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存
                                </button>
                                <a href="/commission/list" class="btn btn-secondary ms-2">
                                    <i class="bi bi-x-lg"></i> 取消
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
