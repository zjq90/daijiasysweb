<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('分成单详情 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-file-earmark-text text-primary"></i> 分成单详情</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/commission/edit/{id}(id=${commissionOrder.id})}" class="btn btn-outline-primary" th:if="${commissionOrder.status == 'PENDING'}">
                        <i class="bi bi-pencil"></i> 编辑
                    </a>
                    <a th:href="@{/commission/settle/{id}(id=${commissionOrder.id})}" 
                       class="btn btn-success ms-2" 
                       th:if="${commissionOrder.status == 'PENDING'}"
                       onclick="return confirm('确定要结算该分成单吗？')">
                        <i class="bi bi-check-circle"></i> 结算
                    </a>
                    <a href="/commission/list" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="text-muted">分成单号</label>
                            <p class="fw-bold" th:text="${commissionOrder.commissionNo}">CM20260101001</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">关联订单号</label>
                            <p th:text="${commissionOrder.orderNo}">ORD20260101001</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">状态</label>
                            <p>
                                <span th:class="'badge rounded-pill ' + 
                                      (commissionOrder.status == 'PENDING' ? 'bg-warning' : 
                                       commissionOrder.status == 'SETTLED' ? 'bg-success' : 'bg-secondary')"
                                      th:text="${commissionOrder.status == 'PENDING' ? '待结算' : 
                                               commissionOrder.status == 'SETTLED' ? '已结算' : '已取消'}">待结算</span>
                            </p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">司机ID</label>
                            <p th:text="${commissionOrder.driverId}">1</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">司机姓名</label>
                            <p th:text="${commissionOrder.driverName}">张三</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">生成时间</label>
                            <p th:text="${#temporals.format(commissionOrder.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00:00</p>
                        </div>
                        <div class="col-md-4" th:if="${commissionOrder.settleTime != null}">
                            <label class="text-muted">结算时间</label>
                            <p th:text="${#temporals.format(commissionOrder.settleTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-02 12:00:00</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-calculator text-warning"></i> 分成明细</h5>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-3">
                            <div class="p-4 bg-light rounded">
                                <h6 class="text-muted">订单金额</h6>
                                <h3 class="text-primary fw-bold">
                                    <span class="text-muted">¥</span>
                                    <span th:text="${#numbers.formatDecimal(commissionOrder.orderAmount, 1, 2)}">150.00</span>
                                </h3>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-4 bg-light rounded">
                                <h6 class="text-muted">平台抽成</h6>
                                <h3 class="text-danger fw-bold">
                                    <span class="text-muted">¥</span>
                                    <span th:text="${#numbers.formatDecimal(commissionOrder.platformCommission, 1, 2)}">22.50</span>
                                </h3>
                                <small class="text-muted" th:text="'(平台抽成 ' + ${commissionOrder.platformRate} + '%)'">(平台抽成 15%)</small>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-4 bg-light rounded">
                                <h6 class="text-muted">司机分成</h6>
                                <h3 class="text-success fw-bold">
                                    <span class="text-muted">¥</span>
                                    <span th:text="${#numbers.formatDecimal(commissionOrder.driverCommission, 1, 2)}">127.50</span>
                                </h3>
                                <small class="text-muted" th:text="'(司机分成 ' + ${commissionOrder.driverRate} + '%)'">(司机分成 85%)</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
