<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('分成单管理 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-file-earmark-text text-primary"></i> 分成单管理</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/commission/add" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> 新增分成单
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>分成单号</th>
                                    <th>关联订单</th>
                                    <th>司机</th>
                                    <th>订单金额</th>
                                    <th>平台抽成</th>
                                    <th>司机分成</th>
                                    <th>分成比例</th>
                                    <th>状态</th>
                                    <th>生成时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${commissionOrders}">
                                    <td>
                                        <a th:href="@{/commission/detail/{id}(id=${order.id})}" class="text-primary fw-bold" th:text="${order.commissionNo}">CM20260101001</a>
                                    </td>
                                    <td th:text="${order.orderNo} ?: '-'">ORD20260101001</td>
                                    <td th:text="${order.driverName}">张三</td>
                                    <td>
                                        <span class="text-muted">¥</span>
                                        <span th:text="${#numbers.formatDecimal(order.orderAmount, 1, 2)}">150.00</span>
                                    </td>
                                    <td>
                                        <span class="text-danger">¥</span>
                                        <span class="text-danger" th:text="${#numbers.formatDecimal(order.platformAmount, 1, 2)}">22.50</span>
                                    </td>
                                    <td>
                                        <span class="text-success">¥</span>
                                        <span class="text-success" th:text="${#numbers.formatDecimal(order.driverAmount, 1, 2)}">127.50</span>
                                    </td>
                                    <td th:text="${order.platformRate} + '% / ' + ${order.driverRate} + '%'">15% / 85%</td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + 
                                              (order.status == 'PENDING' ? 'bg-warning' : 
                                               order.status == 'SETTLED' ? 'bg-success' : 
                                               order.status == 'CANCELLED' ? 'bg-secondary' : 'bg-info')"
                                              th:text="${order.status == 'PENDING' ? '待结算' : 
                                                       order.status == 'SETTLED' ? '已结算' : 
                                                       order.status == 'CANCELLED' ? '已取消' : '处理中'}">待结算</span>
                                    </td>
                                    <td th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/commission/detail/{id}(id=${order.id})}" class="btn btn-outline-primary" title="详情">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/commission/edit/{id}(id=${order.id})}" class="btn btn-outline-secondary" title="编辑">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/commission/settle/{id}(id=${order.id})}" 
                                               class="btn btn-outline-success" 
                                               title="结算"
                                               th:if="${order.status == 'PENDING'}"
                                               onclick="return confirm('确定要结算该分成单吗？')">
                                                <i class="bi bi-check-circle"></i>
                                            </a>
                                            <a th:href="@{/commission/cancel/{id}(id=${order.id})}" 
                                               class="btn btn-outline-danger" 
                                               title="取消"
                                               th:if="${order.status == 'PENDING'}"
                                               onclick="return confirm('确定要取消该分成单吗？')">
                                                <i class="bi bi-x-circle"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(commissionOrders)}">
                                    <td colspan="10" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                        <p class="mt-2">暂无分成单数据</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
