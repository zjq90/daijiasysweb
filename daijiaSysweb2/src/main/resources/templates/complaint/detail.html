<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('投诉单详情 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-exclamation-circle text-warning"></i> 投诉单详情</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/complaint/edit/{id}(id=${complaint.id})}" class="btn btn-outline-primary" th:if="${complaint.status == 'PENDING' || complaint.status == 'PROCESSING'}">
                        <i class="bi bi-pencil"></i> 编辑
                    </a>
                    <a th:href="@{/complaint/handle/{id}(id=${complaint.id})}" class="btn btn-warning ms-2" th:if="${complaint.status == 'PENDING' || complaint.status == 'PROCESSING'}">
                        <i class="bi bi-pencil-square"></i> 处理
                    </a>
                    <a href="/complaint/list" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="text-muted">投诉单号</label>
                            <p class="fw-bold" th:text="${complaint.complaintNo}">CP20260101001</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">关联订单号</label>
                            <p th:text="${complaint.orderNo} ?: '-'">-</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">投诉类型</label>
                            <p th:text="${complaint.type}">服务态度</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">当前状态</label>
                            <p>
                                <span th:class="'badge rounded-pill ' + 
                                      (complaint.status == 'PENDING' ? 'bg-warning' : 
                                       complaint.status == 'PROCESSING' ? 'bg-primary' : 
                                       complaint.status == 'RESOLVED' ? 'bg-success' : 'bg-secondary')"
                                      th:text="${complaint.status == 'PENDING' ? '待处理' : 
                                               complaint.status == 'PROCESSING' ? '处理中' : 
                                               complaint.status == 'RESOLVED' ? '已解决' : '已驳回'}">待处理</span>
                            </p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted">投诉时间</label>
                            <p th:text="${#temporals.format(complaint.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00:00</p>
                        </div>
                        <div class="col-md-4" th:if="${complaint.updateTime != null}">
                            <label class="text-muted">更新时间</label>
                            <p th:text="${#temporals.format(complaint.updateTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 14:00:00</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-person-circle text-info"></i> 被投诉司机信息</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="text-muted">司机ID</label>
                                    <p th:text="${complaint.driverId}">1</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">司机姓名</label>
                                    <p th:text="${complaint.driverName}">张三</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-person text-secondary"></i> 投诉人信息</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="text-muted">投诉人姓名</label>
                                    <p th:text="${complaint.complainantName}">乘客A</p>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-muted">投诉人电话</label>
                                    <p th:text="${complaint.complainantPhone}">13800138000</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-chat-left-text text-primary"></i> 投诉内容</h5>
                </div>
                <div class="card-body">
                    <p th:text="${complaint.content}">投诉内容...</p>
                </div>
            </div>

            <div class="card" th:if="${complaint.handleRemark != null || complaint.creditDeduct != null}">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-file-text text-success"></i> 处理信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4" th:if="${complaint.creditDeduct != null}">
                            <label class="text-muted">信用扣分</label>
                            <p>
                                <span class="text-danger fw-bold" th:text="${complaint.creditDeduct}">5</span> 分
                            </p>
                        </div>
                        <div class="col-md-8" th:if="${complaint.handleRemark != null}">
                            <label class="text-muted">处理备注</label>
                            <p th:text="${complaint.handleRemark}">处理备注内容...</p>
                        </div>
                        <div class="col-md-4" th:if="${complaint.handleTime != null}">
                            <label class="text-muted">处理时间</label>
                            <p th:text="${#temporals.format(complaint.handleTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 14:00:00</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
