<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('投诉单表单 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-exclamation-circle text-warning"></i> 
                    <span th:if="${complaint.id == null}">新增投诉单</span>
                    <span th:if="${complaint.id != null}">编辑投诉单</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/complaint/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/complaint/save}" th:object="${complaint}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">投诉单号</label>
                                <input type="text" th:field="*{complaintNo}" class="form-control" placeholder="系统自动生成" th:readonly="${complaint.id != null}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">关联订单号</label>
                                <input type="text" th:field="*{orderNo}" class="form-control" placeholder="请输入关联订单号">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">被投诉司机ID</label>
                                <input type="number" th:field="*{driverId}" class="form-control" placeholder="请输入司机ID">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">被投诉司机姓名</label>
                                <input type="text" th:field="*{driverName}" class="form-control" placeholder="请输入司机姓名">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">投诉人姓名</label>
                                <input type="text" th:field="*{complainantName}" class="form-control" placeholder="请输入投诉人姓名">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">投诉人电话</label>
                                <input type="tel" th:field="*{complainantPhone}" class="form-control" placeholder="请输入投诉人电话">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">投诉类型</label>
                                <select th:field="*{type}" class="form-select">
                                    <option value="">请选择</option>
                                    <option value="服务态度">服务态度</option>
                                    <option value="迟到">迟到</option>
                                    <option value="拒单">拒单</option>
                                    <option value="绕路">绕路</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="col-md-6" th:if="${complaint.id != null}">
                                <label class="form-label">状态</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="PENDING">待处理</option>
                                    <option value="PROCESSING">处理中</option>
                                    <option value="RESOLVED">已解决</option>
                                    <option value="REJECTED">已驳回</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">投诉内容</label>
                                <textarea th:field="*{content}" class="form-control" rows="4" placeholder="请输入投诉内容"></textarea>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存
                                </button>
                                <a href="/complaint/list" class="btn btn-secondary ms-2">
                                    <i class="bi bi-x-lg"></i> 取消
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
