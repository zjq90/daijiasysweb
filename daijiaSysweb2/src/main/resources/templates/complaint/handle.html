<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('处理投诉单 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-pencil-square text-warning"></i> 处理投诉单</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/complaint/detail/{id}(id=${complaint.id})}" class="btn btn-outline-secondary">
                        <i class="bi bi-eye"></i> 查看详情
                    </a>
                    <a href="/complaint/list" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 投诉单信息</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-borderless table-sm">
                                <tr>
                                    <td style="width: 120px;" class="text-muted">投诉单号</td>
                                    <td th:text="${complaint.complaintNo}">CP20260101001</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">关联订单</td>
                                    <td th:text="${complaint.orderNo} ?: '-'">-</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">被投诉司机</td>
                                    <td th:text="${complaint.driverName}">张三</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">投诉人</td>
                                    <td th:text="${complaint.complainantName}">乘客A</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">投诉类型</td>
                                    <td th:text="${complaint.type}">服务态度</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">当前状态</td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + 
                                              (complaint.status == 'PENDING' ? 'bg-warning' : 
                                               complaint.status == 'PROCESSING' ? 'bg-primary' : 
                                               complaint.status == 'RESOLVED' ? 'bg-success' : 'bg-secondary')"
                                              th:text="${complaint.status == 'PENDING' ? '待处理' : 
                                                       complaint.status == 'PROCESSING' ? '处理中' : 
                                                       complaint.status == 'RESOLVED' ? '已解决' : '已驳回'}">待处理</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-muted">投诉内容</td>
                                    <td th:text="${complaint.content}">投诉内容</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-pencil-square text-primary"></i> 处理信息</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/complaint/handle/{id}(id=${complaint.id})}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">处理状态 <span class="text-danger">*</span></label>
                                    <select name="status" class="form-select" required>
                                        <option value="PROCESSING" th:selected="${complaint.status == 'PROCESSING'}">处理中</option>
                                        <option value="RESOLVED">已解决</option>
                                        <option value="REJECTED">已驳回</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">处理备注</label>
                                    <textarea name="handleRemark" class="form-control" rows="4" 
                                              th:text="${complaint.handleRemark}"
                                              placeholder="请输入处理备注"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">信用扣分</label>
                                    <input type="number" name="creditDeduct" class="form-control" 
                                           th:value="${complaint.creditDeduct}"
                                           placeholder="请输入信用扣分（0-100）" min="0" max="100">
                                    <div class="form-text">扣分范围：0-100，0表示不扣分</div>
                                </div>

                                <div class="row">
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check-lg"></i> 提交处理
                                        </button>
                                        <a th:href="@{/complaint/detail/{id}(id=${complaint.id})}" class="btn btn-secondary ms-2">
                                            <i class="bi bi-x-lg"></i> 取消
                                        </a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
