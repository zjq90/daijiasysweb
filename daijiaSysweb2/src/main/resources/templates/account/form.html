<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('账户表单 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-person-plus text-primary"></i> 
                    <span th:if="${account.id == null}">新增账户</span>
                    <span th:if="${account.id != null}">编辑账户</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/account/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/account/save}" th:object="${account}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">司机姓名 <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{driverName}" class="form-control" placeholder="请输入司机姓名" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">手机号 <span class="text-danger">*</span></label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="请输入手机号" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">身份证号</label>
                                <input type="text" th:field="*{idCard}" class="form-control" placeholder="请输入身份证号">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">账户状态</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="ACTIVE">正常</option>
                                    <option value="FROZEN">冻结</option>
                                    <option value="CANCELLED">注销</option>
                                </select>
                            </div>
                            
                            <div th:if="${account.id != null}" class="col-12">
                                <hr>
                                <h6 class="text-muted mb-3">账户资金信息（只读）</h6>
                                <div class="row g-3">
                                    <div class="col-md-3">
                                        <label class="form-label">账户余额</label>
                                        <input type="text" th:field="*{balance}" class="form-control" readonly>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">冻结余额</label>
                                        <input type="text" th:field="*{frozenBalance}" class="form-control" readonly>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">累计收入</label>
                                        <input type="text" th:field="*{totalIncome}" class="form-control" readonly>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">累计提现</label>
                                        <input type="text" th:field="*{totalWithdraw}" class="form-control" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存
                                </button>
                                <a href="/account/list" class="btn btn-secondary ms-2">
                                    <i class="bi bi-x-lg"></i> 取消
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
