<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('账户详情 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-person-circle text-primary"></i> 账户详情</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/account/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                    <a th:href="@{/account/edit/{id}(id=${account.id})}" class="btn btn-primary ms-2">
                        <i class="bi bi-pencil"></i> 编辑
                    </a>
                </div>
            </div>

            <!-- 账户基本信息 -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <table class="table table-borderless">
                                <tr>
                                    <td style="width: 120px;" class="text-muted">账户ID</td>
                                    <td th:text="${account.id}">1</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">司机姓名</td>
                                    <td th:text="${account.driverName}">张三</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">手机号</td>
                                    <td th:text="${account.phone}">13800138001</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">身份证号</td>
                                    <td th:text="${account.idCard}">110101199001011001</td>
                                </tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <table class="table table-borderless">
                                <tr>
                                    <td style="width: 120px;" class="text-muted">账户状态</td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + (account.status == 'ACTIVE' ? 'bg-success' : account.status == 'FROZEN' ? 'bg-warning' : 'bg-secondary')"
                                              th:text="${account.status == 'ACTIVE' ? '正常' : account.status == 'FROZEN' ? '冻结' : '注销'}">正常</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-muted">账户余额</td>
                                    <td>
                                        <span class="text-success fw-bold" th:text="'¥' + ${#numbers.formatDecimal(account.balance, 1, 2)}">¥0.00</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-muted">冻结余额</td>
                                    <td>
                                        <span class="text-warning fw-bold" th:text="'¥' + ${#numbers.formatDecimal(account.frozenBalance, 1, 2)}">¥0.00</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-muted">创建时间</td>
                                    <td th:text="${#temporals.format(account.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 00:00:00</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 账户统计 -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-graph-up text-primary"></i> 账户统计</h5>
                </div>
                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-md-3">
                            <div class="card stat-card">
                                <div class="card-body text-center">
                                    <h6 class="text-muted text-uppercase mb-2">累计收入</h6>
                                    <h3 class="mb-0 text-success" th:text="'¥' + ${#numbers.formatDecimal(account.totalIncome, 1, 2)}">¥0.00</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card stat-card-danger">
                                <div class="card-body text-center">
                                    <h6 class="text-muted text-uppercase mb-2">累计提现</h6>
                                    <h3 class="mb-0 text-danger" th:text="'¥' + ${#numbers.formatDecimal(account.totalWithdraw, 1, 2)}">¥0.00</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card stat-card">
                                <div class="card-body text-center">
                                    <h6 class="text-muted text-uppercase mb-2">可用余额</h6>
                                    <h3 class="mb-0 text-primary" th:text="'¥' + ${#numbers.formatDecimal(account.balance, 1, 2)}">¥0.00</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card stat-card-warning">
                                <div class="card-body text-center">
                                    <h6 class="text-muted text-uppercase mb-2">冻结金额</h6>
                                    <h3 class="mb-0 text-warning" th:text="'¥' + ${#numbers.formatDecimal(account.frozenBalance, 1, 2)}">¥0.00</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 账户明细 -->
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-list-ul text-primary"></i> 账户明细</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>明细ID</th>
                                    <th>关联订单号</th>
                                    <th>类型</th>
                                    <th>金额</th>
                                    <th>变动前余额</th>
                                    <th>变动后余额</th>
                                    <th>描述</th>
                                    <th>时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${details}">
                                    <td th:text="${detail.id}">1</td>
                                    <td th:text="${detail.orderNo} ?: '-'">-</td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + 
                                              (detail.type == 'INCOME' ? 'bg-success' : 
                                               detail.type == 'WITHDRAW' ? 'bg-primary' : 
                                               detail.type == 'REFUND' ? 'bg-info' : 'bg-danger')"
                                              th:text="${detail.type == 'INCOME' ? '收入' : 
                                                       detail.type == 'WITHDRAW' ? '提现' : 
                                                       detail.type == 'REFUND' ? '退款' : '罚款'}">收入</span>
                                    </td>
                                    <td>
                                        <span th:class="${detail.type == 'INCOME' || detail.type == 'REFUND' ? 'text-success' : 'text-danger'}"
                                              th:text="${(detail.type == 'INCOME' || detail.type == 'REFUND' ? '+' : '-') + '¥' + #numbers.formatDecimal(detail.amount, 1, 2)}">+¥0.00</span>
                                    </td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(detail.balanceBefore, 1, 2)}">¥0.00</td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(detail.balanceAfter, 1, 2)}">¥0.00</td>
                                    <td th:text="${detail.description}">订单分成收入</td>
                                    <td th:text="${#temporals.format(detail.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(details)}">
                                    <td colspan="8" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                        <p class="mt-2">暂无账户明细</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
