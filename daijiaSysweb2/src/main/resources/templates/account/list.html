<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('账户信息 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-people text-primary"></i> 账户信息</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/account/add" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> 新增账户
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>司机姓名</th>
                                    <th>手机号</th>
                                    <th>身份证号</th>
                                    <th>账户余额</th>
                                    <th>冻结余额</th>
                                    <th>累计收入</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="account : ${accounts}">
                                    <td th:text="${account.id}">1</td>
                                    <td th:text="${account.driverName}">张三</td>
                                    <td th:text="${account.phone}">13800138001</td>
                                    <td th:text="${account.idCard}">110101199001011001</td>
                                    <td>
                                        <span class="text-success fw-bold" th:text="'¥' + ${#numbers.formatDecimal(account.balance, 1, 2)}">¥0.00</span>
                                    </td>
                                    <td>
                                        <span class="text-warning fw-bold" th:text="'¥' + ${#numbers.formatDecimal(account.frozenBalance, 1, 2)}">¥0.00</span>
                                    </td>
                                    <td>
                                        <span class="text-primary fw-bold" th:text="'¥' + ${#numbers.formatDecimal(account.totalIncome, 1, 2)}">¥0.00</span>
                                    </td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + (account.status == 'ACTIVE' ? 'bg-success' : account.status == 'FROZEN' ? 'bg-warning' : 'bg-secondary')"
                                              th:text="${account.status == 'ACTIVE' ? '正常' : account.status == 'FROZEN' ? '冻结' : '注销'}">正常</span>
                                    </td>
                                    <td th:text="${#temporals.format(account.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/account/detail/{id}(id=${account.id})}" class="btn btn-outline-primary" title="详情">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/account/edit/{id}(id=${account.id})}" class="btn btn-outline-secondary" title="编辑">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/account/freeze/{id}(id=${account.id})}" 
                                               class="btn btn-outline-warning" 
                                               th:if="${account.status == 'ACTIVE'}"
                                               title="冻结"
                                               onclick="return confirm('确定要冻结该账户吗？')">
                                                <i class="bi bi-lock"></i>
                                            </a>
                                            <a th:href="@{/account/unfreeze/{id}(id=${account.id})}" 
                                               class="btn btn-outline-success" 
                                               th:if="${account.status == 'FROZEN'}"
                                               title="解冻"
                                               onclick="return confirm('确定要解冻该账户吗？')">
                                                <i class="bi bi-unlock"></i>
                                            </a>
                                            <a th:href="@{/account/delete/{id}(id=${account.id})}" 
                                               class="btn btn-outline-danger" 
                                               title="删除"
                                               onclick="return confirm('确定要删除该账户吗？此操作不可恢复。')">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(accounts)}">
                                    <td colspan="10" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                        <p class="mt-2">暂无账户数据</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
