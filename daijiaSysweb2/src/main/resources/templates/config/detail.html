<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('分成配置详情 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-gear text-secondary"></i> 分成配置详情</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/config/edit/{id}(id=${config.id})}" class="btn btn-outline-primary">
                        <i class="bi bi-pencil"></i> 编辑
                    </a>
                    <a href="/config/list" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="card mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 基本信息</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-borderless">
                                <tr>
                                    <td class="text-muted" style="width: 120px;">配置名称</td>
                                    <td th:text="${config.configName}">标准分成配置</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">状态</td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + (config.status == 'ACTIVE' ? 'bg-success' : 'bg-secondary')"
                                              th:text="${config.status == 'ACTIVE' ? '启用' : '禁用'}">启用</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-muted">适用金额范围</td>
                                    <td th:text="'¥' + ${config.minAmount} + ' ~ ¥' + ${config.maxAmount}">¥0 ~ ¥500</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">创建时间</td>
                                    <td th:text="${#temporals.format(config.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00:00</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-percent text-warning"></i> 分成比例</h5>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-6">
                                    <div class="p-3 bg-light rounded">
                                        <h6 class="text-muted">平台抽成</h6>
                                        <h2 class="text-danger fw-bold" th:text="${config.platformRate} + '%'">15%</h2>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-3 bg-light rounded">
                                        <h6 class="text-muted">司机分成</h6>
                                        <h2 class="text-success fw-bold" th:text="${config.driverRate} + '%'">85%</h2>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-clock text-info"></i> 自动清账配置</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="text-muted">订单完成自动清账</label>
                            <p>
                                <span th:class="'badge rounded-pill ' + (config.autoSettle ? 'bg-success' : 'bg-secondary')"
                                      th:text="${config.autoSettle ? '已启用' : '未启用'}">已启用</span>
                            </p>
                        </div>
                        <div class="col-md-4" th:if="${config.autoSettle}">
                            <label class="text-muted">清账延迟时间</label>
                            <p th:text="${config.settleDelayHours} + ' 小时'">24 小时</p>
                        </div>
                        <div class="col-md-12">
                            <label class="text-muted">配置描述</label>
                            <p th:text="${config.description}">适用于普通订单的分成配置</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
