<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('系统首页 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-house-door text-primary"></i> 系统首页</h1>
            </div>

            <!-- 统计卡片 -->
            <div class="row g-4 mb-4">
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h5 class="text-muted text-uppercase mb-2">总账户数</h5>
                                    <h3 class="mb-0" th:text="${totalAccounts}">0</h3>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-people-fill text-primary" style="font-size: 2rem;"></i>
                                </div>
                            </div>
                            <p class="text-sm text-muted mt-3 mb-0">
                                <span class="text-success fw-bold" th:text="${activeAccounts}">0</span> 个账户正常
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card-success">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h5 class="text-muted text-uppercase mb-2">总订单数</h5>
                                    <h3 class="mb-0" th:text="${totalOrders}">0</h3>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-receipt text-success" style="font-size: 2rem;"></i>
                                </div>
                            </div>
                            <p class="text-sm text-muted mt-3 mb-0">
                                <span class="text-success fw-bold" th:text="${completedOrders}">0</span> 个订单已完成
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card-warning">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h5 class="text-muted text-uppercase mb-2">待处理投诉</h5>
                                    <h3 class="mb-0" th:text="${pendingComplaints}">0</h3>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 2rem;"></i>
                                </div>
                            </div>
                            <p class="text-sm text-muted mt-3 mb-0">
                                需要及时处理的投诉单
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card-danger">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h5 class="text-muted text-uppercase mb-2">待结算订单</h5>
                                    <h3 class="mb-0" th:text="${pendingSettlements}">0</h3>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-cash-coin text-danger" style="font-size: 2rem;"></i>
                                </div>
                            </div>
                            <p class="text-sm text-muted mt-3 mb-0">
                                等待结算的分成单
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 快捷操作 -->
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-lightning-charge text-primary"></i> 快捷操作</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <a href="/account/add" class="btn btn-outline-primary w-100">
                                <i class="bi bi-person-plus"></i> 新增账户
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a href="/complaint/list" class="btn btn-outline-warning w-100">
                                <i class="bi bi-exclamation-circle"></i> 处理投诉
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a href="/commission/list" class="btn btn-outline-success w-100">
                                <i class="bi bi-cash-stack"></i> 订单结算
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a href="/config/list" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-gear"></i> 分成配置
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 系统信息 -->
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle text-primary"></i> 系统信息</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-borderless table-sm">
                                <tr>
                                    <td style="width: 120px;" class="text-muted">系统名称</td>
                                    <td>代驾Web后台管理系统</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">技术栈</td>
                                    <td>Spring Boot + H2 + Bootstrap 5</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">数据库</td>
                                    <td>H2 内存数据库</td>
                                </tr>
                                <tr>
                                    <td class="text-muted">H2控制台</td>
                                    <td><a href="/h2-console" target="_blank">/h2-console</a></td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-list-check text-primary"></i> 功能模块</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <i class="bi bi-people text-primary"></i> 代驾账户管理
                                    </div>
                                    <span class="badge bg-primary rounded-pill">账户信息、明细</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <i class="bi bi-star text-warning"></i> 信用评价
                                    </div>
                                    <span class="badge bg-warning rounded-pill">投诉单、信用等级</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <i class="bi bi-gear text-secondary"></i> 订单分成配置
                                    </div>
                                    <span class="badge bg-secondary rounded-pill">抽成比例、自动清账</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <i class="bi bi-file-text text-success"></i> 账单管理
                                    </div>
                                    <span class="badge bg-success rounded-pill">分成单、对账单</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
