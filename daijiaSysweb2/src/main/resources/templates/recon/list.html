<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('对账单管理 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-receipt text-success"></i> 对账单管理</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/recon/add" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> 新增对账单
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>对账单号</th>
                                    <th>对账周期</th>
                                    <th>司机</th>
                                    <th>订单数量</th>
                                    <th>订单总额</th>
                                    <th>平台抽成</th>
                                    <th>司机分成</th>
                                    <th>状态</th>
                                    <th>生成时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="recon : ${reconciliations}">
                                    <td>
                                        <a th:href="@{/recon/detail/{id}(id=${recon.id})}" class="text-primary fw-bold" th:text="${recon.reconNo}">RC20260101001</a>
                                    </td>
                                    <td th:text="${#temporals.format(recon.periodStart, 'yyyy-MM-dd')} + ' ~ ' + ${#temporals.format(recon.periodEnd, 'yyyy-MM-dd')}">2026-01-01 ~ 2026-01-07</td>
                                    <td th:text="${recon.driverName}">张三</td>
                                    <td th:text="${recon.orderCount}">10</td>
                                    <td>
                                        <span class="text-muted">¥</span>
                                        <span th:text="${#numbers.formatDecimal(recon.totalAmount, 1, 2)}">1500.00</span>
                                    </td>
                                    <td>
                                        <span class="text-danger">¥</span>
                                        <span class="text-danger" th:text="${#numbers.formatDecimal(recon.platformAmount, 1, 2)}">225.00</span>
                                    </td>
                                    <td>
                                        <span class="text-success">¥</span>
                                        <span class="text-success" th:text="${#numbers.formatDecimal(recon.driverAmount, 1, 2)}">1275.00</span>
                                    </td>
                                    <td>
                                        <span th:class="'badge rounded-pill ' + 
                                              (recon.status == 'PENDING' ? 'bg-warning' : 
                                               recon.status == 'CONFIRMED' ? 'bg-success' : 
                                               recon.status == 'DISPUTED' ? 'bg-danger' : 'bg-secondary')"
                                              th:text="${recon.status == 'PENDING' ? '待确认' : 
                                                       recon.status == 'CONFIRMED' ? '已确认' : 
                                                       recon.status == 'DISPUTED' ? '有异议' : '已关闭'}">待确认</span>
                                    </td>
                                    <td th:text="${#temporals.format(recon.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/recon/detail/{id}(id=${recon.id})}" class="btn btn-outline-primary" title="详情">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/recon/edit/{id}(id=${recon.id})}" class="btn btn-outline-secondary" title="编辑">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/recon/confirm/{id}(id=${recon.id})}" 
                                               class="btn btn-outline-success" 
                                               title="确认"
                                               th:if="${recon.status == 'PENDING'}"
                                               onclick="return confirm('确定要确认该对账单吗？')">
                                                <i class="bi bi-check-circle"></i>
                                            </a>
                                            <a th:href="@{/recon/dispute/{id}(id=${recon.id})}" 
                                               class="btn btn-outline-warning" 
                                               title="异议"
                                               th:if="${recon.status == 'PENDING'}"
                                               onclick="return confirm('确定要标记该对账单为异议状态吗？')">
                                                <i class="bi bi-exclamation-triangle"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(reconciliations)}">
                                    <td colspan="10" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                        <p class="mt-2">暂无对账单数据</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
