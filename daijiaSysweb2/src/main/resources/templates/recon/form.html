<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout::head('对账单表单 - 代驾后台管理系统')"></head>
<body>
<div th:replace="fragments/layout::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/layout::sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:replace="fragments/layout::messages"></div>

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-receipt text-success"></i> 
                    <span th:if="${reconciliation.id == null}">新增对账单</span>
                    <span th:if="${reconciliation.id != null}">编辑对账单</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/recon/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/recon/save}" th:object="${reconciliation}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">对账单号</label>
                                <input type="text" th:field="*{reconNo}" class="form-control" placeholder="系统自动生成" th:readonly="${reconciliation.id != null}">
                            </div>
                            <div class="col-md-6" th:if="${reconciliation.id != null}">
                                <label class="form-label">状态</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="PENDING">待确认</option>
                                    <option value="CONFIRMED">已确认</option>
                                    <option value="DISPUTED">有异议</option>
                                    <option value="CLOSED">已关闭</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">司机ID <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{driverId}" class="form-control" placeholder="请输入司机ID" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">司机姓名</label>
                                <input type="text" th:field="*{driverName}" class="form-control" placeholder="请输入司机姓名">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">对账开始日期</label>
                                <input type="date" th:field="*{periodStart}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">对账结束日期</label>
                                <input type="date" th:field="*{periodEnd}" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">订单数量</label>
                                <input type="number" th:field="*{orderCount}" class="form-control" placeholder="自动统计" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">订单总额 (元)</label>
                                <input type="number" th:field="*{totalAmount}" class="form-control" placeholder="自动统计" min="0" step="0.01">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">司机分成总额 (元)</label>
                                <input type="number" th:field="*{totalCommission}" class="form-control" placeholder="自动统计" min="0" step="0.01">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">备注</label>
                                <textarea th:field="*{remark}" class="form-control" rows="3" placeholder="请输入备注"></textarea>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存
                                </button>
                                <a href="/recon/list" class="btn btn-secondary ms-2">
                                    <i class="bi bi-x-lg"></i> 取消
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/layout::scripts"></div>
</body>
</html>
